# Builds production iOS and Android apps on EAS and submits them to
# TestFlight and the Google Play internal testing track.
# Run it from the Workflows tab on expo.dev (or `bunx eas-cli workflow:run release.yml`).
# It has no automatic trigger, so it only runs when started by hand.
name: Release to stores

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Submit to TestFlight
    type: submit
    needs: [build_ios]
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Submit to Google Play (internal)
    type: submit
    needs: [build_android]
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
